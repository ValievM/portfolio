name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [goshop, pr-reviewer-assignment]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pr_reviewer_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/${{ matrix.project }}/go.mod
          cache-dependency-path: projects/${{ matrix.project }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: Reviewer service integration and E2E tests
        if: matrix.project == 'pr-reviewer-assignment'
        run: go test -p 1 -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./tests/integration ./tests/e2e
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/phone-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
      - run: python3 scripts/check_docs.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            projects/phone-agent/**/build/reports/
            projects/phone-agent/**/build/test-results/
