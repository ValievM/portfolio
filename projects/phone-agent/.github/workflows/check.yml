name: check

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already ships the Android SDK; only the licenses need accepting so
      # Gradle can download the platform and build-tools it is missing. The sdkmanager folder
      # is "latest" on some images and a version number ("16.0") on others, so look it up.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found under $ANDROID_HOME/cmdline-tools; skipping license acceptance"
          else
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, detekt, lint, unit tests
        run: ./gradlew check
      - name: Docs
        run: python3 scripts/check_docs.py
      - name: Keep reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
