name: Задача
description: Задача для агента или решение для владельца
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Что должно стать по-другому и зачем
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Тест-кейсы
      description: Перечень поведений с границами и ошибками (для логики). Пишутся сразу, показываются в отчёте.
  - type: textarea
    id: read
    attributes:
      label: Что читать
      description: 2-4 файла из docs/ и код, с которого начать
  - type: textarea
    id: limits
    attributes:
      label: Границы и запреты
      description: Чего не делать, когда остановиться и спросить
  - type: textarea
    id: done
    attributes:
      label: Готово, когда
    validations:
      required: true
